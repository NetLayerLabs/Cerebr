# Host nginx site for cerebr.xyz -> /etc/nginx/sites-available/cerebr.xyz, linked into sites-enabled.
# Plain HTTP first; `certbot --nginx -d cerebr.xyz -d www.cerebr.xyz` then adds HTTPS and the
# http -> https redirect to this file itself. Always `nginx -t` before `systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name cerebr.xyz www.cerebr.xyz;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8140;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
