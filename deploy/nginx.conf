# nginx inside the container: serves the static build on :80 (published on 127.0.0.1 only).
# TLS, HSTS and the public hostname live in the host reverse proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Real client IP from the host proxy (it reaches the container through the Docker bridge).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Unknown paths: 404 status with the landing page as the body.
    error_page 404 /index.html;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\n"; }
    location = /favicon.ico { access_log off; try_files /brand/favicon.ico =404; }

    # Hashed Vite assets: one year, immutable. A missing asset is a plain 404, never html.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        error_page 404 = @plain404;
        try_files $uri =404;
    }

    location @plain404 { return 404; }

    # Brand images (not hashed): one day.
    location /brand/ {
        error_page 404 = @plain404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # The dApp: /app and /app/<anything> serve the SPA entry (views are #hash routes). 
    location = /app {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ^~ /app/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Landing ("/" and /index.html); anything else that is not a file falls to the 404 above.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
