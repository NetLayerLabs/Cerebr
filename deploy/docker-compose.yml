# Cerebr web (cerebr.xyz): the static app in its own nginx container, published on the VPS loopback only.
# The host nginx proxies cerebr.xyz to it (deploy/nginx-host.conf). From the repo root on the VPS:
#   docker compose -f deploy/docker-compose.yml up -d --build
name: cerebr-web
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cerebr-web:latest
    container_name: cerebr-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8140:80" # loopback only; the host nginx is the only way in
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
