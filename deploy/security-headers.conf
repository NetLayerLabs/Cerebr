# Included in every location that sets its own headers (nginx does not inherit add_header into such locations).
# script-src hashes = the inline theme script in app/index.html and its font onload="this.media='all'" attribute.
# If app/index.html changes, recompute them (command in PREFLIGHT.md) or the theme script is blocked.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0aOapP4V1ELOqHB0m0yA/06MahN0NMqjeqDPXAkN3tw=' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://rpc.xlayer.tech; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
