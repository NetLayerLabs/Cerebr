<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a10" />
    <!-- Theme + language before first paint (no flash): dark by default, light only when chosen. -->
    <script>
      (function () {
        var d = document.documentElement, t = null, l = null
        try { t = localStorage.getItem('cerebr.theme') } catch (e) {}
        try { l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('cerebr.lang') } catch (e) {}
        d.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
        d.lang = l === 'zh' || l === 'zh-CN' ? 'zh-CN' : 'en'
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f4ef')
        // Landing scroll motion: opt in only when it can run and the user has not asked for less motion.
        try {
          if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('js-motion')
        } catch (e) {}
      })()
    </script>
    <title>Cerebr · Neural Processor on X Layer</title>
    <meta name="description" content="Cerebr compiles neurons into NAND netlists, tapes them out on its own TapeOut processor on X Layer and runs inference onchain." />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/brand/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: the app renders at once and the fonts swap in when they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
