specVersion: 1.0.0
description: Cerebr on X Layer - CBR bonding curve, Neural Circuit NFTs, fusion
  and ERC-6551 brain wallets
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: CerebrProcessor
    network: xlayer
    source:
      abi: CerebrProcessor
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Account
        - Trade
        - TapeOut
        - Fusion
        - FeeWithdrawal
        - DailySnapshot
        - Circuit
      abis:
        - name: CerebrProcessor
          file: ./abis/CerebrProcessor.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleCbrTransfer
        - event: TransistorsBought(indexed address,uint256,uint256,uint256,uint256)
          handler: handleTransistorsBought
        - event: TransistorsSold(indexed address,uint256,uint256,uint256,uint256,uint256)
          handler: handleTransistorsSold
        - event: CircuitTapedOut(indexed address,indexed uint256,indexed
            uint8,uint256,uint256)
          handler: handleCircuitTapedOut
        - event: CircuitsFused(indexed address,indexed uint256,uint256,uint256,uint8)
          handler: handleCircuitsFused
        - event: FeesWithdrawn(indexed address,uint256)
          handler: handleFeesWithdrawn
        - event: OwnershipTransferStarted(indexed address,indexed address)
          handler: handleOwnershipTransferStarted
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Paused(address)
          handler: handlePaused
        - event: Unpaused(address)
          handler: handleUnpaused
      file: ./src/processor.ts
  - kind: ethereum
    name: CerebrCircuit
    network: xlayer
    source:
      abi: CerebrCircuit
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Account
        - Circuit
        - CircuitTransfer
        - DailySnapshot
      abis:
        - name: CerebrCircuit
          file: ./abis/CerebrCircuit.json
        - name: CerebrProcessor
          file: ./abis/CerebrProcessor.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleCircuitTransfer
        - event: CircuitRevealed(indexed uint256,uint8,uint256)
          handler: handleCircuitRevealed
        - event: Recommitted(indexed uint256,uint256)
          handler: handleRecommitted
      file: ./src/circuit.ts
  - kind: ethereum
    name: ERC6551Registry
    network: xlayer
    source:
      abi: ERC6551Registry
      address: "0x000000006551c19487814612e58FE06813775758"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Circuit
      abis:
        - name: ERC6551Registry
          file: ./abis/ERC6551Registry.json
      eventHandlers:
        - event: ERC6551AccountCreated(address,indexed address,bytes32,uint256,indexed
            address,indexed uint256)
          handler: handleAccountCreated
      file: ./src/registry.ts
